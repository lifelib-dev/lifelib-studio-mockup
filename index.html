<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifelib Studio - UI draft</title>
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --panel2:#f8f9fb; --border:#e1e4ea; --hover:#f0f2f6;
  --text:#1b2130; --muted:#5b6577; --faint:#687184;
  --accent:#1560d4; --accent-bg:#e6effd; --accent-bd:#b9d0f7;
  --ai:#6a3fd6; --ai-bg:#f2ecff; --ai-bd:#d9c9fb;
  --teal:#0b7268; --teal-bg:#e0f3f0;
  --ok:#147a48; --ok-bg:#e4f5ec; --warn:#9a5b00; --warn-bg:#fff2d9; --err:#bf2f2a; --err-bg:#fdebea;
  --kw:#0a4fb0; --str:#4f7a3b; --num:#ad5500; --com:#8b94a5; --val:#0b5e57; --val-bg:#dff3ef;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
  --shadow:0 6px 24px rgba(20,28,45,.14);
}
[data-theme="dark"]{
  --bg:#12151a; --panel:#191d24; --panel2:#151920; --border:#2a303b; --hover:#212732;
  --text:#e3e7ee; --muted:#9aa4b6; --faint:#828c9e;
  --accent:#5aa2ff; --accent-bg:#17305a; --accent-bd:#2b4f8c;
  --ai:#ad8cff; --ai-bg:#2a2148; --ai-bd:#47397a;
  --teal:#4fd1c0; --teal-bg:#123a37;
  --ok:#55c98b; --ok-bg:#15352a; --warn:#f0b54a; --warn-bg:#3a2d12; --err:#ff7b72; --err-bg:#3d1f1d;
  --kw:#79b8ff; --str:#9ccc7a; --num:#f0a868; --com:#6f7a8c; --val:#6fe0d0; --val-bg:#12332f;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:12.5px/1.45 "Segoe UI",Inter,system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);overflow:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.grow{flex:1}
.muted{color:var(--muted)} .faint{color:var(--faint)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- mockup control strip (not part of the product) ---- */
#mockbar{height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#0f1320;color:#c9d1e3;font-size:12px;min-width:1240px}
#mockbar b{color:#fff;font-weight:600}
#mockbar .seg{display:flex;border:1px solid #2c3550;border-radius:6px;overflow:hidden}
#mockbar .seg button{padding:3px 10px;color:#aab4cc;border-right:1px solid #2c3550}
#mockbar .seg button:last-child{border-right:0}
#mockbar .seg button.on{background:#ffb020;color:#1a1200;font-weight:600}
#mockbar .lbl{color:#7f8aa6}

/* ---- app frame ---- */
#app{display:grid;grid-template-columns:44px 280px minmax(0,1fr) 360px;grid-template-rows:40px minmax(0,1fr) 24px;
  height:calc(100vh - 36px);min-height:660px;min-width:1240px;background:var(--border);gap:1px}
#app.no-right{grid-template-columns:44px 280px minmax(0,1fr) 0}
#app.no-right .right{display:none}
.topbar{grid-column:1/-1;background:var(--panel);display:flex;align-items:center;gap:12px;padding:0 12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.01em}
.brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--teal));color:#fff;display:grid;place-items:center;font:700 10px var(--mono)}
.crumb{color:var(--muted)} .crumb b{color:var(--text);font-weight:600}
.omni{flex:0 1 430px;margin:0 auto;height:26px;border:1px solid var(--border);border-radius:7px;background:var(--panel2);display:flex;align-items:center;gap:8px;padding:0 9px;color:var(--faint)}
.omni kbd,.kbd{font:10.5px var(--mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--panel)}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);white-space:nowrap}
.badge.rt-browser{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.rt-desktop{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.iconbtn{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn.on{color:var(--accent);background:var(--accent-bg)}
.iconbtn.ai.on,.iconbtn.ai:hover{color:var(--ai);background:var(--ai-bg)}

.rail{background:var(--panel2);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:4px}
.rail .iconbtn{width:32px;height:32px;position:relative}
.rail .iconbtn.on::before{content:"";position:absolute;left:-6px;top:6px;bottom:6px;width:2px;background:var(--accent);border-radius:2px}

.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.left{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.6fr) minmax(0,1fr);gap:1px;background:var(--border);min-height:0}
.center{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:1px;background:var(--border);min-width:0;min-height:0}
#work{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1.2fr);gap:1px;background:var(--border);min-height:0}
#work.single{grid-template-rows:minmax(0,1fr)}
.ph{height:30px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;border-bottom:1px solid var(--border);background:var(--panel2);
  font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ph .iconbtn{width:22px;height:22px}
.scroll{overflow:auto;min-height:0;flex:1}
.tabs{height:30px;flex:none;display:flex;align-items:stretch;border-bottom:1px solid var(--border);background:var(--panel2)}
.tab{padding:0 12px;display:flex;align-items:center;gap:6px;border-right:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--panel);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.tab.ai.on{box-shadow:inset 0 2px 0 var(--ai)}
.tab .cnt{font-size:10px;padding:0 5px;border-radius:8px;background:var(--ai);color:#fff;line-height:15px}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{padding:1px 9px;font-size:11.5px;color:var(--muted);border-right:1px solid var(--border);line-height:19px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);padding:1px 7px;border:1px solid var(--border);border-radius:6px;background:var(--panel);line-height:19px}
.chk.on{color:var(--teal);border-color:var(--teal);background:var(--teal-bg)}
.chk i{width:9px;height:9px;border-radius:2px;border:1.5px solid currentColor;display:inline-block}
.chk.on i{background:currentColor}

/* ---- explorer ---- */
.filter{margin:6px 8px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);padding:0 8px;width:calc(100% - 16px);outline:none}
.filter:focus{border-color:var(--accent)}
.row{height:24px;display:flex;align-items:center;gap:6px;padding-right:8px;white-space:nowrap;cursor:pointer}
.row:hover{background:var(--hover)}
.row.on{background:var(--accent-bg)}
.row .car{width:12px;color:var(--faint);font-size:9px;text-align:center;flex:none}
.ic{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;font:700 10px/1 var(--mono);flex:none}
.ic.m{background:var(--text);color:var(--panel)} .ic.s{background:var(--accent-bg);color:var(--accent)}
.ic.c{background:var(--teal-bg);color:var(--teal)} .ic.r{background:var(--hover);color:var(--muted)}
.row .sig{color:var(--faint);font-family:var(--mono);font-size:11.5px}
.row .nm{font-family:var(--mono);font-size:12px}
.row .meta{margin-left:auto;color:var(--faint);font-size:10.5px;font-family:var(--mono);min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .nm,.row .ic,.row .car,.row .tag{flex:none}
.row.inh .nm{font-style:italic;color:var(--muted)}
.tag{font-size:10px;padding:0 5px;border-radius:4px;line-height:15px;font-weight:600}
.tag.ov{background:var(--warn-bg);color:var(--warn)} .tag.base{background:var(--hover);color:var(--muted)} .tag.new{background:var(--ai-bg);color:var(--ai)}
.grp{height:22px;display:flex;align-items:center;padding-left:34px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

/* ---- inspector ---- */
.insp{padding:10px 12px}
.insp h3{margin:0 0 8px;font:600 13px var(--mono);display:flex;align-items:center;gap:7px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:3px 8px;font-size:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.docs{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);color:var(--muted)}
.docs b{color:var(--text);display:block;margin-bottom:2px}
a.lk,.lk{color:var(--teal);cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}

/* ---- node bar ---- */
.nodebar{background:var(--panel);height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;position:relative}
.nodebar .path{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nodebar > *:not(.path):not(.grow){flex:none}
.nodebar .path b{color:var(--text);font-weight:600}
.argbox{display:flex;align-items:center;gap:3px;border:1px solid var(--border);border-radius:6px;padding:0 3px 0 8px;height:26px;background:var(--panel2);font-family:var(--mono)}
.argbox input{width:40px;border:0;background:transparent;text-align:center;outline:none;font-family:var(--mono)}
.argbox button{width:18px;height:20px;border-radius:4px;color:var(--muted)} .argbox button:hover{background:var(--hover);color:var(--text)}
.eq{color:var(--faint);font-family:var(--mono)}
.nodeval{font:600 14px var(--mono);color:var(--val);background:var(--val-bg);padding:1px 9px;border-radius:6px;white-space:nowrap}
.type{font:10.5px var(--mono);color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.btn{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.ai{color:var(--ai);border-color:var(--ai-bd);background:var(--ai-bg)}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---- code ---- */
.code{font:12px/1.65 var(--mono);padding:6px 0;white-space:pre;tab-size:4}
.ln{display:flex;min-width:max-content}
.ln .no{width:40px;flex:none;text-align:right;padding-right:12px;color:var(--faint);user-select:none}
.ln .tx{flex:1;padding-right:16px}
.kw{color:var(--kw);font-weight:600} .st{color:var(--str)} .nu{color:var(--num)} .co{color:var(--com);font-style:italic} .fn{font-weight:700}
.doc{color:var(--str);opacity:.85}
.cref{color:var(--teal);cursor:pointer;border-bottom:1px dotted currentColor}
.cref:hover{background:var(--teal-bg)}
.rref{color:var(--num);cursor:pointer;border-bottom:1px dotted currentColor}
.pill{display:inline-block;margin-left:5px;padding:0 6px;border-radius:9px;background:var(--val-bg);color:var(--val);font-size:10.5px;line-height:15px;vertical-align:1px;font-weight:600}
.pill.arg{background:var(--accent-bg);color:var(--accent)}
.fold{color:var(--str);background:var(--hover);border-radius:4px;padding:0 6px;cursor:pointer}
.fold em{color:var(--faint);font-style:normal;margin-left:6px}
.fhead{position:sticky;top:0;background:var(--panel2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px 10px;font:600 12px var(--mono);display:flex;gap:8px;align-items:center;cursor:pointer;z-index:2}
.fhead.on{background:var(--accent-bg);color:var(--accent)}
.hint{flex:none;border-top:1px solid var(--border);background:var(--panel2);padding:4px 10px;font-size:11px;color:var(--faint);display:flex;gap:12px;align-items:center}

/* ---- data ---- */
.subbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border)}
.bigval{padding:18px 20px}
.bigval .lab{font:12px var(--mono);color:var(--muted)}
.bigval .num{font:600 30px/1.2 var(--mono);color:var(--val);margin:4px 0 6px}
.strip{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.strip button{border:1px solid var(--border);border-radius:7px;padding:5px 10px;text-align:left;min-width:104px;background:var(--panel2)}
.strip button.on{border-color:var(--accent);background:var(--accent-bg)}
.strip small{display:block;color:var(--faint);font:10.5px var(--mono)} .strip span{font:12px var(--mono)}
table.grid{border-collapse:separate;border-spacing:0;font:12px var(--mono);width:max-content}
.grid th,.grid td{padding:3px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap}
.grid thead th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:600;text-align:right;z-index:1}
.grid th.ix,.grid td.ix{position:sticky;left:0;background:var(--panel2);color:var(--muted);text-align:left;font-weight:500}
.grid thead th.ix{z-index:3}
.grid td{text-align:right} .grid td.s{text-align:left;color:var(--str)}
.grid tr.on td{background:var(--accent-bg)} .grid tbody tr:hover td{background:var(--hover)} .grid tr.click{cursor:pointer}
.statline{flex:none;border-top:1px solid var(--border);background:var(--panel2);padding:3px 10px;font:11px var(--mono);color:var(--muted);display:flex;gap:16px}
.statline b{color:var(--text);font-weight:600}

/* ---- trace ---- */
.tsplit{display:grid;grid-template-rows:minmax(0,1.25fr) minmax(0,1fr);min-height:0;flex:1}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 150px 84px;align-items:center;height:24px;border-bottom:1px solid var(--border);cursor:pointer;font:12px var(--mono)}
.trow:hover{background:var(--hover)} .trow.on{background:var(--accent-bg)}
.trow.head{position:sticky;top:0;background:var(--panel2);color:var(--muted);font:600 11px "Segoe UI",sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:default;z-index:1}
.trow > div{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .v{text-align:right;color:var(--val)} .trow .ty{color:var(--faint);font-size:11px}
.trow .car{display:inline-block;width:14px;color:var(--faint);font-size:9px}
.trow .more{color:var(--accent)}
.evalhead{flex:none;padding:4px 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--panel2);font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}

/* ---- svg graphs ---- */
.gwrap{padding:12px;overflow:auto;flex:1;min-height:0}
.gn rect{fill:var(--panel);stroke:var(--border);stroke-width:1.2}
.gn text{font:11px var(--mono);fill:var(--text)} .gn .gv{fill:var(--val);font-size:10.5px}
.gn{cursor:pointer}
.gn:hover rect{stroke:var(--accent)} .gn.sel rect{stroke:var(--accent);stroke-width:2;fill:var(--accent-bg)}
.gn.in rect{stroke:var(--ok)} .gn.out rect{stroke:var(--accent)}
.ge{fill:none;stroke:var(--faint);stroke-width:1;opacity:.55}
.ge.cyc{stroke:var(--warn);stroke-dasharray:4 3;opacity:.9}
svg.dim .ge{opacity:.08} svg.dim .gn{opacity:.25}
svg.dim .ge.hl{opacity:1;stroke:var(--accent);stroke-width:1.6} svg.dim .gn.hl{opacity:1}
.cyc-box{fill:var(--warn-bg);stroke:var(--warn);stroke-dasharray:5 4;opacity:.55}
.cyc-lab{font:600 10.5px "Segoe UI",sans-serif;fill:var(--warn)}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;border:1.5px solid var(--border);vertical-align:-1px;margin-right:4px}

/* ---- review ---- */
.rev{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0;flex:1}
.rev .list{border-right:1px solid var(--border);overflow:auto}
.chg{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer}
.chg.on{background:var(--ai-bg)}
.chg .k{font:600 10px var(--mono);margin-right:6px} .chg .k.add{color:var(--ok)} .chg .k.mod{color:var(--warn)}
.diff{font:12px/1.65 var(--mono);white-space:pre;margin:10px 12px;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.diff .dh{background:var(--panel2);padding:3px 10px;color:var(--muted);border-bottom:1px solid var(--border);font-size:11px}
.diff .dl{padding:0 10px} .diff .del{background:var(--err-bg);color:var(--err)} .diff .add{background:var(--ok-bg);color:var(--ok)}
.sect{margin:12px 12px 4px;font:650 11px "Segoe UI",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
table.impact{border-collapse:collapse;margin:0 12px;font:12px var(--mono)}
.impact th,.impact td{padding:3px 14px 3px 0;text-align:right;border-bottom:1px solid var(--border)}
.impact th{color:var(--muted);font-weight:600} .impact td:first-child,.impact th:first-child{text-align:left}
.neg{color:var(--err)} .pos{color:var(--ok)}
.checks{margin:6px 12px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.checks span::before{content:"\2713";color:var(--ok);font-weight:700;margin-right:6px}
.actions{flex:none;border-top:1px solid var(--border);background:var(--panel2);padding:8px 12px;display:flex;gap:8px;align-items:center}
.empty{padding:34px 24px;color:var(--muted);text-align:center} .empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}

/* ---- build ---- */
.banner{margin:10px 12px 0;padding:8px 12px;border-radius:7px;background:var(--warn-bg);color:var(--warn);font-size:12px;display:flex;gap:10px;align-items:center}
.steps{display:flex;gap:0;margin:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.step{flex:1;padding:8px 10px;border-right:1px solid var(--border);background:var(--panel2);min-width:0}
.step:last-child{border-right:0}
.step b{display:block;font-size:12px} .step small{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .st{font:700 10px var(--mono);margin-bottom:3px;display:block}
.step.done .st{color:var(--ok)} .step.off{opacity:.45} .step.off .st{color:var(--faint)} .step.warn .st{color:var(--warn)}
.bgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;margin:0 12px 12px;min-height:0}
.card{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel)}
.card h4{margin:0;padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--border);font:650 11px "Segoe UI",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.log{font:11.5px/1.6 var(--mono);padding:8px 10px;white-space:pre;color:var(--muted);overflow:auto;max-height:170px}
.log .w{color:var(--warn)} .log .g{color:var(--ok)}
.illus{font:600 10px "Segoe UI",sans-serif;color:var(--warn);background:var(--warn-bg);padding:0 6px;border-radius:4px;letter-spacing:.03em;text-transform:none}

/* ---- bottom ---- */
.bottom{height:196px} .bottom.closed{height:30px}
.console{font:12px/1.6 var(--mono);padding:8px 12px;white-space:pre}
.console .in{color:var(--ok)} .console .out{color:var(--err)}
.cursor{display:inline-block;width:7px;height:14px;background:var(--text);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* ---- assistant ---- */
.right .ph{color:var(--ai)}
.keyline{flex:none;padding:5px 10px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.chat{padding:12px;display:flex;flex-direction:column;gap:12px}
.msg.u{align-self:flex-end;max-width:88%;background:var(--accent-bg);border-radius:10px 10px 2px 10px;padding:7px 10px}
.msg.a{line-height:1.6}
.msg.a p{margin:0 0 8px}
.ctx{display:inline-flex;gap:4px;align-items:center;font:11px var(--mono);color:var(--accent);background:var(--panel);border:1px solid var(--accent-bd);border-radius:10px;padding:0 7px;margin-bottom:4px}
.toolline{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:7px;padding:4px 8px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
.toolline .tl{font-family:var(--mono);margin-top:4px;white-space:pre-line;color:var(--faint)}
.cite{font:11px var(--mono);padding:0 6px;border-radius:9px;background:var(--ai-bg);color:var(--ai);border:1px solid var(--ai-bd);line-height:17px;white-space:nowrap;display:inline-block}
.cite:hover{background:var(--ai);color:#fff}
.verified{font-size:11px;color:var(--ok);display:flex;gap:5px;align-items:center}
.prop{border:1px solid var(--ai-bd);border-radius:9px;overflow:hidden;background:var(--panel)}
.prop .hd{background:var(--ai-bg);color:var(--ai);padding:6px 10px;font-weight:650;display:flex;gap:6px;align-items:center}
.prop .bd{padding:8px 10px;font-size:12px} .prop .bd div{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px}
.prop .ft{padding:8px 10px;border-top:1px solid var(--border);display:flex;gap:6px}
.sysline{font-size:11px;color:var(--ok);text-align:center}
.composer{flex:none;border-top:1px solid var(--border);padding:8px 10px;background:var(--panel2)}
.composer .box{border:1px solid var(--border);border-radius:9px;background:var(--panel);padding:7px 9px;min-height:54px;color:var(--faint)}
.composer .bar{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--muted)}

/* ---- status + misc ---- */
.status{grid-column:1/-1;background:var(--panel2);display:flex;align-items:center;gap:16px;padding:0 12px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.status .sep{width:1px;height:12px;background:var(--border)}
.welcome{padding:26px 30px;overflow:auto}
.welcome h1{margin:0 0 4px;font-size:22px;letter-spacing:-.01em} .welcome p.lead{margin:0 0 18px;color:var(--muted);font-size:13.5px;max-width:720px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mcard{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:6px;cursor:pointer}
.mcard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.mcard b{font-family:var(--mono)} .mcard small{color:var(--faint);font-family:var(--mono)} .mcard p{margin:0;color:var(--muted);font-size:12px;flex:1}
.tour{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.tour div{border-radius:10px;padding:12px;background:var(--panel2);border:1px solid var(--border)}
.tour span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:11px;margin-right:6px}
.privacy{margin-top:16px;padding:10px 12px;border-radius:8px;background:var(--ok-bg);color:var(--ok);font-size:12px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
#toast.show{opacity:1}

/* ---- design annotations (mockup only) ---- */
.note{position:absolute;width:18px;height:18px;border-radius:50%;background:#ffb020;color:#1a1200;font:700 10px/18px "Segoe UI",sans-serif;text-align:center;z-index:40;cursor:help;box-shadow:0 0 0 2px var(--panel)}
.note:hover{z-index:60}
.note:hover::after{content:attr(data-note);position:absolute;top:22px;left:0;width:270px;background:#0f1320;color:#e8ecf5;font:400 12px/1.5 "Segoe UI",sans-serif;padding:9px 11px;border-radius:8px;text-align:left;box-shadow:var(--shadow);white-space:normal}
.note.r:hover::after{left:auto;right:0}
.note.up:hover::after{top:auto;bottom:22px}
body.no-notes .note{display:none}
</style>
</head>

  <footer class="status" id="status"></footer>
</div>

<script>window.MX_DATA={"gallery":[{"lib":"basiclife","name":"BasicTerm_S","desc":"New-business term model that runs each model point separately. The most readable formulas; suited to validation."},{"lib":"basiclife","name":"BasicTerm_M","desc":"Same results as BasicTerm_S, but every formula runs for all model points at once as vector operations. Fast."},{"lib":"basiclife","name":"BasicTerm_SC","desc":"A variant of BasicTerm_S optimised for cythonization with modelx-cython."},{"lib":"basiclife","name":"BasicTerm_SE","desc":"In-force policies plus new business at any future time, projected one model point at a time."},{"lib":"basiclife","name":"BasicTerm_ME","desc":"In-force policies plus future new business, all model points at once."},{"lib":"basiclife","name":"BasicTermASL_ME","desc":"Adjustable step length: monthly steps first, annual afterwards, with policy anniversaries handled precisely."}],"meta":{"model":"BasicTerm_S","space":"Projection","spaceParams":["point_id"],"pointId":1,"projLen":121,"modelx":"0.33.0","lifelib":"0.17.1","python":"3.13.9","spaceDoc":{"title":"The main Space in the :mod:`~basiclife.BasicTerm_S` model.","body":":mod:`~basiclife.BasicTerm_S.Projection` is the only Space defined in the :mod:`~basiclife.BasicTerm_S` model, and it contains all the logic and data used in the model."}},"cells":[{"name":"age","params":["t"],"source":"def age(t):\n    \"\"\"The attained age at time t.\n\n    Defined as::\n\n        age_at_entry() + duration(t)\n\n    .. seealso::\n\n        * :func:`age_at_entry`\n        * :func:`duration`\n\n    \"\"\"\n    return age_at_entry() + duration(t)\n","docRange":[2,13],"doc":{"title":"The attained age at time t.","body":"Defined as"},"kind":"series","nvalues":121},{"name":"age_at_entry","params":[],"source":"def age_at_entry():\n    \"\"\"The age at entry of the selected model point\n\n    The element labeled ``age_at_entry`` of the Series returned by\n    :func:`model_point`.\n    \"\"\"\n    return model_point()[\"age_at_entry\"]\n","docRange":[2,6],"doc":{"title":"The age at entry of the selected model point","body":"The element labeled ``age_at_entry`` of the Series returned by :func:`model_point`."},"kind":"scalar","nvalues":1},{"name":"check_pv_net_cf","params":[],"source":"def check_pv_net_cf():\n    \"\"\"Check present value summation\n\n    Check if the present value of :func:`net_cf` matches the\n    sum of the present values each cashflows.\n    Returns the check result as :obj:`True` or :obj:`False`.\n\n     .. seealso::\n\n        * :func:`net_cf`\n        * :func:`pv_net_cf`\n\n    \"\"\"\n\n    import math\n    res = sum(list(net_cf(t) for t in range(proj_len())) * disc_factors()[:proj_len()])\n\n    return math.isclose(res, pv_net_cf())\n","docRange":[2,13],"doc":{"title":"Check present value summation","body":"Check if the present value of :func:`net_cf` matches the sum of the present values each cashflows. Returns the check result as :obj:`True` or :obj:`False`."},"kind":"scalar","nvalues":1},{"name":"claim_pp","params":["t"],"source":"def claim_pp(t):\n    \"\"\"Claim per policy\n\n    The claim amount per plicy. Defaults to :func:`sum_assured`.\n    \"\"\"\n    return sum_assured()\n","docRange":[2,5],"doc":{"title":"Claim per policy","body":"The claim amount per plicy. Defaults to :func:`sum_assured`."},"kind":"series","nvalues":121},{"name":"claims","params":["t"],"source":"def claims(t):\n    \"\"\"Claims\n\n    Claims during the period from ``t`` to ``t+1`` defined as::\n\n        claim_pp(t) * pols_death(t)\n\n    .. seealso::\n\n        * :func:`claim_pp`\n        * :func:`pols_death`\n\n    \"\"\"\n    return claim_pp(t) * pols_death(t)\n","docRange":[2,13],"doc":{"title":"Claims","body":"Claims during the period from ``t`` to ``t+1`` defined as"},"kind":"series","nvalues":121},{"name":"commissions","params":["t"],"source":"def commissions(t): \n    \"\"\"Commissions\n\n    By default, 100% premiums for the first year, 0 otherwise.\n\n    .. seealso::\n\n        * :func:`premiums`\n        * :func:`duration`\n\n    \"\"\"\n    return premiums(t) if duration(t) == 0 else 0\n","docRange":[2,11],"doc":{"title":"Commissions","body":"By default, 100% premiums for the first year, 0 otherwise."},"kind":"series","nvalues":121},{"name":"disc_factors","params":[],"source":"def disc_factors():\n    \"\"\"Discount factors.\n\n    Vector of the discount factors as a Numpy array. Used for calculating\n    the present values of cashflows.\n\n    .. seealso::\n\n        :func:`disc_rate_mth`\n    \"\"\"\n    return np.array(list((1 + disc_rate_mth()[t])**(-t) for t in range(proj_len())))\n","docRange":[2,10],"doc":{"title":"Discount factors.","body":"Vector of the discount factors as a Numpy array. Used for calculating the present values of cashflows."},"kind":"table","nvalues":1},{"name":"disc_rate_mth","params":[],"source":"def disc_rate_mth():\n    \"\"\"Monthly discount rate\n\n    Nummpy array of monthly discount rates from time 0 to :func:`proj_len` - 1\n    defined as::\n\n        (1 + disc_rate_ann)**(1/12) - 1\n\n    .. seealso::\n\n        :func:`disc_rate_ann`\n\n    \"\"\"\n    return np.array(list((1 + disc_rate_ann[t//12])**(1/12) - 1 for t in range(proj_len())))\n","docRange":[2,13],"doc":{"title":"Monthly discount rate","body":"Nummpy array of monthly discount rates from time 0 to :func:`proj_len` - 1 defined as"},"kind":"table","nvalues":1},{"name":"duration","params":["t"],"source":"def duration(t):\n    \"\"\"Duration in force in years\"\"\"\n    return t//12\n","docRange":[2,2],"doc":{"title":"Duration in force in years","body":""},"kind":"series","nvalues":121},{"name":"expense_acq","params":[],"source":"def expense_acq():\n    \"\"\"Acquisition expense per policy\n\n    ``300`` by default.\n    \"\"\"\n    return 300\n","docRange":[2,5],"doc":{"title":"Acquisition expense per policy","body":"``300`` by default."},"kind":"scalar","nvalues":1},{"name":"expense_maint","params":[],"source":"def expense_maint():\n    \"\"\"Annual maintenance expense per policy\n\n    ``60`` by default.\n    \"\"\"\n    return 60\n","docRange":[2,5],"doc":{"title":"Annual maintenance expense per policy","body":"``60`` by default."},"kind":"scalar","nvalues":1},{"name":"expenses","params":["t"],"source":"def expenses(t):\n    \"\"\"Acquisition and maintenance expenses\n\n    Expense cashflow during the period from ``t`` to ``t+1``.\n    For any ``t``, the maintenance expense is recognized,\n    which is defined as::\n\n        pols_if(t) * expense_maint()/12 * inflation_factor(t)\n\n    At ``t=0`` only, the acquisition expense,\n    defined as :func:`expense_acq`, is recognized.\n\n    .. seealso::\n\n        * :func:`pols_if`\n        * :func:`expense_maint`\n        * :func:`inflation_factor`\n\n    .. versionchanged:: 0.2.0\n       The maintenance expense is also recognized for ``t=0``.\n\n    \"\"\"\n    maint = pols_if(t) * expense_maint()/12 * inflation_factor(t)\n\n    if t == 0:\n        return expense_acq() + maint\n    else:\n        return maint\n","docRange":[2,22],"doc":{"title":"Acquisition and maintenance expenses","body":"Expense cashflow during the period from ``t`` to ``t+1``. For any ``t``, the maintenance expense is recognized, which is defined as"},"kind":"series","nvalues":121},{"name":"inflation_factor","params":["t"],"source":"def inflation_factor(t):\n    \"\"\"The inflation factor at time t\n\n    .. seealso::\n\n        * :func:`inflation_rate`\n\n    \"\"\"\n    return (1 + inflation_rate())**(t/12)\n","docRange":[2,8],"doc":{"title":"The inflation factor at time t","body":".. seealso"},"kind":"series","nvalues":121},{"name":"inflation_rate","params":[],"source":"def inflation_rate():\n    \"\"\"Inflation rate\"\"\"\n    return 0.01\n","docRange":[2,2],"doc":{"title":"Inflation rate","body":""},"kind":"scalar","nvalues":1},{"name":"lapse_rate","params":["t"],"source":"def lapse_rate(t):\n    \"\"\"Lapse rate\n\n    By default, the lapse rate assumption is defined by duration as::\n\n        max(0.1 - 0.02 * duration(t), 0.02)\n\n    .. seealso::\n\n        :func:`duration`\n\n    \"\"\"\n    return max(0.1 - 0.02 * duration(t), 0.02)\n","docRange":[2,12],"doc":{"title":"Lapse rate","body":"By default, the lapse rate assumption is defined by duration as"},"kind":"series","nvalues":120},{"name":"loading_prem","params":[],"source":"def loading_prem():\n    \"\"\"Loading per premium\n\n    ``0.5`` by default.\n\n    .. seealso::\n\n        * :func:`premium_pp`\n\n    \"\"\"\n    return 0.50\n","docRange":[2,10],"doc":{"title":"Loading per premium","body":"``0.5`` by default."},"kind":"scalar","nvalues":1},{"name":"model_point","params":[],"source":"def model_point():\n    \"\"\"The selected model point as a Series\n\n    :func:`model_point` looks up :attr:`model_point_table`, and\n    returns as a Series the row whose label is the value of\n    :attr:`point_id`.\n\n    Example:\n        In the code below ``Projection`` refers to\n        the :mod:`~basiclife.BasicTerm_S.Projection` space::\n\n            >>> Projection.point_id\n            1\n\n            >>> Projection.model_point()\n            age_at_entry        47\n            sex                  M\n            policy_term         10\n            policy_count         1\n            sum_assured     622000\n            Name: 1, dtype: object\n\n            >>> Projection.point_id = 2\n\n            >>> Projection.model_point()\n            age_at_entry        29\n            sex                  M\n            policy_term         20\n            policy_count         1\n            sum_assured     752000\n            Name: 2, dtype: object\n\n    \"\"\"\n    return model_point_table.loc[point_id]\n","docRange":[2,33],"doc":{"title":"The selected model point as a Series","body":":func:`model_point` looks up :attr:`model_point_table`, and returns as a Series the row whose label is the value of :attr:`point_id`."},"kind":"table","nvalues":1},{"name":"mort_rate","params":["t"],"source":"def mort_rate(t):\n    \"\"\"Mortality rate to be applied at time t\n\n    .. seealso::\n\n       * :attr:`mort_table`\n       * :func:`mort_rate_mth`\n\n    \"\"\"\n    return mort_table[str(max(min(5, duration(t)),0))][age(t)]\n","docRange":[2,9],"doc":{"title":"Mortality rate to be applied at time t","body":".. seealso"},"kind":"series","nvalues":121},{"name":"mort_rate_mth","params":["t"],"source":"def mort_rate_mth(t):\n    \"\"\"Monthly mortality rate to be applied at time t\n\n    .. seealso::\n\n       * :attr:`mort_table`\n       * :func:`mort_rate`\n\n    \"\"\"\n    return 1-(1- mort_rate(t))**(1/12)\n","docRange":[2,9],"doc":{"title":"Monthly mortality rate to be applied at time t","body":".. seealso"},"kind":"series","nvalues":121},{"name":"net_cf","params":["t"],"source":"def net_cf(t):\n    \"\"\"Net cashflow\n\n    Net cashflow for the period from ``t`` to ``t+1`` defined as::\n\n        premiums(t) - claims(t) - expenses(t) - commissions(t)\n\n    .. seealso::\n\n        * :func:`premiums`\n        * :func:`claims`\n        * :func:`expenses`\n        * :func:`commissions`\n\n    \"\"\"\n    return premiums(t) - claims(t) - expenses(t) - commissions(t)\n","docRange":[2,15],"doc":{"title":"Net cashflow","body":"Net cashflow for the period from ``t`` to ``t+1`` defined as"},"kind":"series","nvalues":121},{"name":"net_premium_pp","params":[],"source":"def net_premium_pp():\n    \"\"\"Net premium per policy\n\n    The net premium per policy is defined so that\n    the present value of net premiums equates to the present value of\n    claims::\n\n        pv_claims() / pv_pols_if()\n\n    .. seealso::\n\n        * :func:`pv_claims`\n        * :func:`pv_pols_if`\n\n    \"\"\"\n    return pv_claims() / pv_pols_if()\n","docRange":[2,15],"doc":{"title":"Net premium per policy","body":"The net premium per policy is defined so that the present value of net premiums equates to the present value of claims"},"kind":"scalar","nvalues":1},{"name":"policy_term","params":[],"source":"def policy_term():\n    \"\"\"The policy term of the selected model point.\n\n    The element labeled ``policy_term`` of the Series returned by\n    :func:`model_point`.\n    \"\"\"\n\n    return model_point()[\"policy_term\"]\n","docRange":[2,6],"doc":{"title":"The policy term of the selected model point.","body":"The element labeled ``policy_term`` of the Series returned by :func:`model_point`."},"kind":"scalar","nvalues":1},{"name":"pols_death","params":["t"],"source":"def pols_death(t):\n    \"\"\"Number of death occurring at time t\"\"\"\n    return pols_if(t) * mort_rate_mth(t)\n","docRange":[2,2],"doc":{"title":"Number of death occurring at time t","body":""},"kind":"series","nvalues":121},{"name":"pols_if","params":["t"],"source":"def pols_if(t):\n    \"\"\"Number of policies in-force\n\n    Number of in-force policies calculated recursively.\n    The initial value is read from :func:`pols_if_init`.\n    Subsequent values are defined recursively as::\n\n        pols_if(t-1) - pols_lapse(t-1) - pols_death(t-1) - pols_maturity(t)\n\n    .. seealso::\n        * :func:`pols_lapse`\n        * :func:`pols_death`\n        * :func:`pols_maturity`\n\n    \"\"\"\n    if t==0:\n        return pols_if_init()\n    elif t > policy_term() * 12:\n        return 0\n    else:\n        return pols_if(t-1) - pols_lapse(t-1) - pols_death(t-1) - pols_maturity(t)\n","docRange":[2,15],"doc":{"title":"Number of policies in-force","body":"Number of in-force policies calculated recursively. The initial value is read from :func:`pols_if_init`. Subsequent values are defined recursively as"},"kind":"series","nvalues":121},{"name":"pols_if_init","params":[],"source":"def pols_if_init(): \n    \"\"\"Initial Number of Policies In-force\n\n    Number of in-force policies at time 0 referenced from :func:`pols_if`.\n    Defaults to 1.\n    \"\"\"\n    return 1\n","docRange":[2,6],"doc":{"title":"Initial Number of Policies In-force","body":"Number of in-force policies at time 0 referenced from :func:`pols_if`. Defaults to 1."},"kind":"scalar","nvalues":1},{"name":"pols_lapse","params":["t"],"source":"def pols_lapse(t):\n    \"\"\"Number of lapse occurring at time t\n\n    .. seealso::\n        * :func:`pols_if`\n        * :func:`lapse_rate`\n\n    \"\"\"\n    return (pols_if(t) - pols_death(t)) * (1-(1 - lapse_rate(t))**(1/12))\n","docRange":[2,8],"doc":{"title":"Number of lapse occurring at time t","body":".. seealso::     * :func:`pols_if`     * :func:`lapse_rate`"},"kind":"series","nvalues":120},{"name":"pols_maturity","params":["t"],"source":"def pols_maturity(t):\n    \"\"\"Number of maturing policies\n\n    The policy maturity occurs at ``t == 12 * policy_term()``,\n    after death and lapse during the last period::\n\n        pols_if(t-1) - pols_lapse(t-1) - pols_death(t-1)\n\n    otherwise ``0``.\n    \"\"\"\n    if t == policy_term() * 12:\n        return pols_if(t-1) - pols_lapse(t-1) - pols_death(t-1)\n    else:\n        return 0\n","docRange":[2,10],"doc":{"title":"Number of maturing policies","body":"The policy maturity occurs at ``t == 12 * policy_term()``, after death and lapse during the last period"},"kind":"series","nvalues":120},{"name":"premium_pp","params":[],"source":"def premium_pp():\n    \"\"\"Monthly premium per policy\n\n    Monthly premium amount per policy defined as::\n\n        round((1 + loading_prem()) * net_premium(), 2)\n\n    .. versionchanged:: 0.2.0\n       The ``t`` parameter is removed.\n\n    .. seealso::\n\n        * :func:`loading_prem`\n        * :func:`net_premium_pp`\n\n    \"\"\"\n    return round((1 + loading_prem()) * net_premium_pp(), 2)\n","docRange":[2,16],"doc":{"title":"Monthly premium per policy","body":"Monthly premium amount per policy defined as"},"kind":"scalar","nvalues":1},{"name":"premiums","params":["t"],"source":"def premiums(t):\n    \"\"\"Premium income\n\n    Premium income during the period from ``t`` to ``t+1`` defined as::\n\n        premium_pp(t) * pols_if(t)\n\n    .. seealso::\n\n        * :func:`premium_pp`\n        * :func:`pols_if`\n\n    \"\"\"\n    return premium_pp() * pols_if(t)\n","docRange":[2,13],"doc":{"title":"Premium income","body":"Premium income during the period from ``t`` to ``t+1`` defined as"},"kind":"series","nvalues":121},{"name":"proj_len","params":[],"source":"def proj_len():\n    \"\"\"Projection length in months\n\n    Projection length in months defined as::\n\n        12 * policy_term() + 1\n\n    .. seealso::\n\n        :func:`policy_term`\n\n    \"\"\"\n    return 12 * policy_term() + 1\n","docRange":[2,12],"doc":{"title":"Projection length in months","body":"Projection length in months defined as"},"kind":"scalar","nvalues":1},{"name":"pv_claims","params":[],"source":"def pv_claims():\n    \"\"\"Present value of claims\n\n    .. seealso::\n\n        * :func:`claims`\n\n    \"\"\"\n    return sum(list(claims(t) for t in range(proj_len())) * disc_factors()[:proj_len()])\n","docRange":[2,8],"doc":{"title":"Present value of claims","body":".. seealso"},"kind":"scalar","nvalues":1},{"name":"pv_commissions","params":[],"source":"def pv_commissions():\n    \"\"\"Present value of commissions\n\n    .. seealso::\n\n        * :func:`expenses`\n\n    \"\"\"\n    return sum(list(commissions(t) for t in range(proj_len())) * disc_factors()[:proj_len()])\n","docRange":[2,8],"doc":{"title":"Present value of commissions","body":".. seealso"},"kind":"scalar","nvalues":1},{"name":"pv_expenses","params":[],"source":"def pv_expenses():\n    \"\"\"Present value of expenses\n\n    .. seealso::\n\n        * :func:`expenses`\n\n    \"\"\"\n    return sum(list(expenses(t) for t in range(proj_len())) * disc_factors()[:proj_len()])\n","docRange":[2,8],"doc":{"title":"Present value of expenses","body":".. seealso"},"kind":"scalar","nvalues":1},{"name":"pv_net_cf","params":[],"source":"def pv_net_cf():\n    \"\"\"Present value of net cashflows.\n\n    Defined as::\n\n        pv_premiums() - pv_claims() - pv_expenses() - pv_commissions()\n\n    .. seealso::\n\n        * :func:`pv_premiums`\n        * :func:`pv_claims`\n        * :func:`pv_expenses`\n        * :func:`pv_commissions`\n\n    \"\"\"\n\n    return pv_premiums() - pv_claims() - pv_expenses() - pv_commissions()\n","docRange":[2,15],"doc":{"title":"Present value of net cashflows.","body":"Defined as"},"kind":"scalar","nvalues":1},{"name":"pv_pols_if","params":[],"source":"def pv_pols_if():\n    \"\"\"Present value of policies in-force\n\n    The discounted sum of the number of in-force policies at each month.\n    It is used as the annuity factor for calculating :func:`net_premium_pp`.\n\n    \"\"\"\n    return sum(list(pols_if(t) for t in range(proj_len())) * disc_factors()[:proj_len()])\n","docRange":[2,7],"doc":{"title":"Present value of policies in-force","body":"The discounted sum of the number of in-force policies at each month. It is used as the annuity factor for calculating :func:`net_premium_pp`."},"kind":"scalar","nvalues":1},{"name":"pv_premiums","params":[],"source":"def pv_premiums():\n    \"\"\"Present value of premiums\n\n    .. seealso::\n\n        * :func:`premiums`\n\n    \"\"\"\n    return sum(list(premiums(t) for t in range(proj_len())) * disc_factors()[:proj_len()])\n","docRange":[2,8],"doc":{"title":"Present value of premiums","body":".. seealso"},"kind":"scalar","nvalues":1},{"name":"result_cf","params":[],"source":"def result_cf():\n    \"\"\"Result table of cashflows\n\n    .. seealso::\n\n       * :func:`premiums`\n       * :func:`claims`\n       * :func:`expenses`\n       * :func:`commissions`\n       * :func:`net_cf`\n\n    \"\"\"\n\n    t_len = range(proj_len())\n\n    data = {\n        \"Premiums\": [premiums(t) for t in t_len],\n        \"Claims\": [claims(t) for t in t_len],\n        \"Expenses\": [expenses(t) for t in t_len],\n        \"Commissions\": [commissions(t) for t in t_len],\n        \"Net Cashflow\": [net_cf(t) for t in t_len]\n    }\n    return pd.DataFrame.from_dict(data)\n","docRange":[2,12],"doc":{"title":"Result table of cashflows","body":".. seealso"},"kind":"table","nvalues":1},{"name":"result_pv","params":[],"source":"def result_pv():\n    \"\"\"Result table of present value of cashflows\n\n    .. seealso::\n\n       * :func:`pv_premiums`\n       * :func:`pv_claims`\n       * :func:`pv_expenses`\n       * :func:`pv_commissions`\n       * :func:`pv_net_cf`\n\n    \"\"\"\n\n    cols = [\"Premiums\", \"Claims\", \"Expenses\", \"Commissions\", \"Net Cashflow\"]\n    pvs = [pv_premiums(), pv_claims(), pv_expenses(), pv_commissions(), pv_net_cf()]\n    per_prem = [x / pv_premiums() for x in pvs]\n\n    return pd.DataFrame.from_dict(\n            data={\"PV\": pvs, \"% Premium\": per_prem},\n            columns=cols,\n            orient='index')\n","docRange":[2,12],"doc":{"title":"Result table of present value of cashflows","body":".. seealso"},"kind":"table","nvalues":1},{"name":"sex","params":[],"source":"def sex(): \n    \"\"\"The sex of the selected model point\n\n    .. note::\n       This cells is not used by default.\n\n    The element labeled ``sex`` of the Series returned by\n    :func:`model_point`.\n    \"\"\"\n    return model_point()[\"sex\"]\n","docRange":[2,9],"doc":{"title":"The sex of the selected model point","body":".. note::    This cells is not used by default."},"kind":"scalar","nvalues":1},{"name":"sum_assured","params":[],"source":"def sum_assured():\n    \"\"\"The sum assured of the selected model point\n\n    The element labeled ``sum_assured`` of the Series returned by\n    :func:`model_point`.\n    \"\"\"\n    return model_point()[\"sum_assured\"]\n","docRange":[2,6],"doc":{"title":"The sum assured of the selected model point","body":"The element labeled ``sum_assured`` of the Series returned by :func:`model_point`."},"kind":"scalar","nvalues":1}],"values":{"age":{"kind":"series","type":"int64","values":[47,47,47,47,47,47,47,47,47,47,47,47,48,48,48,48,48,48,48,48,48,48,48,48,49,49,49,49,49,49,49,49,49,49,49 /* ---------- values ---------- */
function fmt(v){
  if(v===null||v===undefined) return '—';
  if(typeof v==='boolean') return v?'True':'False';
  if(typeof v==='string') return v;
  if(Number.isInteger(v)) return v.toLocaleString('en-US');
  const a=Math.abs(v);
  if(a!==0 && a<1e-3) return v.toPrecision(6).replace(/0+$/,'');
  const d = a>=1000?2 : a>=1?4 : 6;
  return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:d});
}
const nodeKey = (name,args) => name+'('+(args||[]).join(',')+')';
function label(name,args){ const p=CELLS[name]?CELLS[name].params:[]; return name+'('+p.map((x,i)=>x+'='+args[i]).join(', ')+')'; }
function nodeVal(name,args){
  const v=D.values[name]; if(!v) return {text:'—',type:''};
  if(v.kind==='scalar') return {text:fmt(v.value), type:v.type, raw:v.value};
  if(v.kind==='series'){ const x=v.values[args[0]]; return {text:(x===undefined||x===null)?'not computed':fmt(x), type:v.type, raw:x}; }
  if(v.kind==='table') return {text:v.type.split(' ')[0]+' '+v.table.shape.join(' × '), type:v.type, table:v.table};
  return {text:'—',type:v.type||''};
}

/* ---------- navigation ---------- */
function go(sel,push=true){
  S.sel=sel; S.welcome=false;
  if(push){ S.hist=S.hist.slice(0,S.hpos+1); S.hist.push(sel); S.hpos=S.hist.length-1; }
  S.expanded=new Set(['r']); S.showAll=new Set(); S.traceSel=null;
  const v = sel.kind==='cells' ? D.values[sel.name] : null;
  if(!(v && v.kind==='series') && S.dataTab!=='value') S.dataTab='value';
  render();
}
function goCells(name,args){
  const c=CELLS[name]; if(!c) return;
  if(args===undefined||args===null) args = c.params.length ? [(S.sel.kind==='cells'&&S.sel.args.length)?S.sel.args[0]:0] : [];
  go({kind:'cells',name,args});
}
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2600); }

/* ---------- python highlighter with links and inline values ---------- */
const KW=new Set('def return if elif else for in import from as lambda and or not is None True False while with try except raise pass'.split(' '));
function hl(code, pills, self){
  const re=/("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(#[^\n]*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/g;
  let out='', m, depth=0, prev='', stack=[];
  while((m=re.exec(code))){
    if(m[1]) out+=`<span class="st">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="co">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="nu">${m[3]}</span>`;
    else if(m[4]){
      const w=m[4], call=code[re.lastIndex]==='(';
      if(KW.has(w)) out+=`<span class="kw">${w}</span>`;
      else if(prev==='def') out+=`<span class="fn">${w}</span>`;
      else if(CELLS[w] && prev!=='.'){
        const p=pills&&pills.get(w); const a=p&&p.args?` data-args="${p.args.join(',')}"`:'';
        out+=`<span class="cref" data-act="go" data-name="${w}"${a} title="Go to ${w}">${w}</span>`;
        if(p){ if(call) stack.push({html:`<span class="pill">${esc(p.text)}</span>`,at:depth}); else out+=`<span class="pill">${esc(p.text)}</span>`; }
      }
      else if(REFS[w] && prev!=='.') out+=`<span class="rref" data-act="goref" data-name="${w}" title="Reference: ${esc(REFS[w].type)}">${w}</span>`;
      else out+=w;
      prev=w; continue;
    } else {
      const ch=m[5]; out+=esc(ch);
      if(ch==='(') depth++;
      if(ch===')'){ depth--; while(stack.length && stack[stack.length-1].at===depth) out+=stack.pop().html; }
      if(ch.trim()) prev=ch;
      continue;
    }
    prev='x';
  }
  return out;
}
function pillsFor(name,args){
  const map=new Map(), list=D.preds[nodeKey(name,args)]; if(!list) return map;
  const by={}; list.forEach(p=>{ if(p.name) (by[p.name]=by[p.name]||[]).push(p); });
  Object.entries(by).forEach(([n,arr])=>{
    if(arr.length===1) map.set(n,{text:'= '+nodeVal(n,arr[0].args).text, args:arr[0].args});
    else map.set(n,{text:arr.length+' nodes', args:null});
  });
  return map;
}
function formulaHtml(name,args,withVals){
  const c=CELLS[name], lines=c.source.replace(/\n+$/,'').split('\n');
  const pills = withVals ? pillsFor(name,args) : null;
  const rows=[], dr=c.docRange;
  const push=(no,html)=>rows.push(`<div class="ln"><span class="no">${no}</span><span class="tx">${html}</span></div>`);
  const seg=(from,to)=>{ // 1-based inclusive
    if(from>to) return;
    hl(lines.slice(from-1,to).join('\n'),pills,name).split('\n').forEach((h,i)=>{
      let extra=''; if(from+i===1 && withVals && args.length) extra=`<span class="pill arg">${c.params.map((p,j)=>p+' = '+args[j]).join(', ')}</span>`;
      push(from+i,h+extra);
    });
  };
  if(dr){
    seg(1,dr[0]-1);
    if(S.docs) for(let i=dr[0];i<=dr[1];i++) push(i,`<span class="doc">${esc(lines[i-1])}</span>`);
    else push(dr[0],`${esc(lines[dr[0]-1].match(/^\s*/)[0])}<span class="fold" data-act="docs" title="Unfold docstring">""" ${esc(c.doc.title||'')} """<em>${dr[1]-dr[0]+1} lines</em></span>`);
    seg(dr[1]+1,lines.length);
  } else seg(1,lines.length);
  return rows.join('');
}

function trow(o){

  if(S.leftView==='files'){

function chartSvg(vals,tcur){

  const ticks=[0,.25,.5,.75,1].map(f=>{const v=mn+span*f; return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end" font-size="10" fill="var(--faint)" font-family="var(--mono)">${esc(fmt(v))}</text>`;}).join('');

  const cur=(vals[tcur]!==null&&vals[tcur]!==undefined)?`<line x1="${X(tcur)}" x2="${X(tcur)}" y1="${T}" y2="${H-B}" stroke="var(--accent)" stroke-dasharray="3 3"/><circle cx="${X(tcur)}" cy="${Y(vals[tcur])}" r="4" fill="var(--accent)"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block">${ticks}${xt}<path d="${path}" fill="none" stroke="var(--teal)" stroke-width="1.8"/>${cur}</svg>`;

function traceRows(node,path,depth,out){
  const src = S.traceDir==='preds'?D.preds:D.succs;
  const isRef=!!node.ref, key=isRef?null:nodeKey(node.name,node.args), kids=isRef?[]:src[key];
  const has = kids && kids.length, unknown = !isRef && kids===undefined, open=S.expanded.has(path);
  const nv = isRef ? {text:REFS[node.ref]?(REFS[node.ref].type+' '+(REFS[node.ref].summary||'')):'',type:'reference'} : nodeVal(node.name,node.args);
  const sel = S.traceSel ? S.traceSel.path===path : path==='r';
  out.push(`<div class="trow ${sel?'on':''}" data-act="tpick" data-path="${path}" ${isRef?`data-ref="${node.ref}"`:`data-name="${node.name}" data-args="${node.args.join(',')}"`}>
    <div style="padding-left:${10+depth*16}px"><span class="car" data-act="ttoggle" data-path="${path}">${has?(open?'▾':'▸'):(unknown?'·':'')}</span>${isRef?`<span class="ic r" style="margin-right:6px">→</span>${esc(node.ref)}`:`<span class="ic c" style="margin-right:6px">ƒ</span>${esc(label(node.name,node.args))}`}</div>
    <div class="v">${esc(nv.text)}</div><div class="ty">${esc(nv.type)}</div></div>`);
  if(has && open){
    const all=S.showAll.has(path), list=all?kids:kids.slice(0,8);
    list.forEach((k,i)=>traceRows(k,path+'/'+i,depth+1,out));
    if(!all && kids.length>8) out.push(`<div class="trow" data-act="tall" data-path="${path}"><div style="padding-left:${26+(depth+1)*16}px" class="more">… ${kids.length-8} more</div><div></div><div></div></div>`);
  }
}
function traceGraph(root){

  const NW=196,NH=36,GY=10, cols=[[root],a1,l2], rows=Math.max(1,a1.length,l2.length), H=rows*(NH+GY)+30, W=3*NW+2*70+20;

  cols.forEach((col,c)=>col.forEach((n,i)=>{ const v=nodeVal(n.name,n.args); h+=`<g class="gn ${c===0?'sel':''}" data-act="go" data-name="${n.name}" data-args="${n.args.join(',')}"><rect x="${cx(c)}" y="${cy(c,i)}" width="${NW}" height="${NH}" rx="7"/><text x="${cx(c)+9}" y="${cy(c,i)+15}">${esc(label(n.name,n.args))}</text><text class="gv" x="${cx(c)+9}" y="${cy(c,i)+29}">${esc(v.text)}</text></g>`; }));

function renderTrace(){

function renderMap(){
  const NW=124,NH=24,GX=8,GY=22, layers={}; D.map.nodes.forEach(n=>(layers[n.layer]=layers[n.layer]||[]).push(n));
  const L=Object.keys(layers).map(Number).sort((a,b)=>a-b), maxc=Math.max(...L.map(l=>layers[l].length)), W=maxc*(NW+GX)-GX+40, H=L.length*(NH+GY)-GY+44, pos={};
  L.forEach((l,li)=>{ const arr=layers[l].sort((a,b)=>a.row-b.row), w=arr.length*(NW+GX)-GX, x0=(W-w)/2; arr.forEach((n,i)=>pos[n.name]={x:x0+i*(NW+GX),y:22+li*(NH+GY),l}); });
  const cyc=new Set(D.map.cycles.flat());
  let h=`<svg id="mapsvg" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block">`;
  D.map.cycles.forEach(g=>{ const ps=g.map(n=>pos[n]), x1=Math.min(...ps.map(p=>p.x))-8, x2=Math.max(...ps.map(p=>p.x))+NW+8, y=ps[0].y-16;
    h+=`<rect class="cyc-box" x="${x1}" y="${y}" width="${x2-x1}" height="${NH+36}" rx="9"/><text class="cyc-lab" x="${x1+8}" y="${y+11}">time-recursive loop · pols_if(t) needs pols_if(t-1)</text>`; });
  D.map.edges.forEach(([a,b])=>{ const A=pos[a],B=pos[b]; if(!A||!B) return;
    if(A.l===B.l){ const xa=A.x+NW/2,xb=B.x+NW/2,y=A.y+NH; h+=`<path class="ge cyc" data-a="${a}" data-b="${b}" d="M${xa} ${y}C${xa} ${y+16} ${xb} ${y+16} ${xb} ${y}"/>`; }
    else { const xa=A.x+NW/2,ya=A.y+NH,xb=B.x+NW/2,yb=B.y,k=Math.max(14,(yb-ya)*.45); h+=`<path class="ge" data-a="${a}" data-b="${b}" d="M${xa} ${ya}C${xa} ${ya+k} ${xb} ${yb-k} ${xb} ${yb}"/>`; } });
  D.map.nodes.forEach(n=>{ const p=pos[n.name], sel=S.sel.kind==='cells'&&S.sel.name===n.name;
    h+=`<g class="gn mn ${sel?'sel':''} ${n.inputs===0?'in':''} ${n.outputs===0?'out':''}" data-n="${n.name}" data-act="go" data-name="${n.name}"><rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="6"/><text x="${p.x+NW/2}" y="${p.y+16}" text-anchor="middle">${esc(n.name)}</text></g>`; });
  return `<div class="subbar"><span class="muted">Whole model at <b style="color:var(--text)">cells</b> level · ${D.map.nodes.length} cells, ${D.map.edges.length} dependencies · inputs at the top, results at the bottom</span><span class="grow"></span>
    <div class="legend"><span><i style="border-color:var(--ok)"></i>no precedents (input)</span><span><i style="border-color:var(--accent)"></i>nothing depends on it</span><span><i style="border-color:var(--warn);border-style:dashed;background:var(--warn-bg)"></i>loop through time</span></div></div>
    <div class="gwrap">${h}</svg></div>`;
}

    g.addEventListener('mouseenter',()=>{ const n=g.dataset.n; svg.classList.add('dim'); g.classList.add('hl');
      svg.querySelectorAll('.ge').forEach(e=>{ if(e.dataset.a===n||e.dataset.b===n){ e.classList.add('hl'); const o=e.dataset.a===n?e.dataset.b:e.dataset.a; const og=svg.querySelector('.mn[data-n="'+o+'"]'); if(og) og.classList.add('hl'); } }); });
    g.addEventListener('mouseleave',()=>{ svg.classList.remove('dim'); svg.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl')); }); }); }
}
function scenario(k){
  S.scenario=k; S.welcome=false; S.rightOpen=true; S.leftView='explorer'; S.bottomOpen=(k==='explore'); S.maxLower=(k==='map'); S.phase1=false;
  if(k==='explore'){ S.lower='data'; S.dataTab='all'; S.fmode='cell'; go({kind:'cells',name:'claims',args:[0]}); return; }
  if(k==='trace'){ S.lower='trace'; S.traceDir='preds'; S.traceView='tree'; go({kind:'cells',name:'pv_claims',args:[]},true); S.expanded=new Set(['r','r/1']); S.traceSel={path:'r/1',name:'claims',args:[0]}; render(); return; }
  if(k==='map'){ S.lower='map'; S.rightOpen=false; go({kind:'cells',name:'pols_if',args:[1]}); return; }
  if(k==='aiedit'){ S.lower='review'; S.revSel=1; if(S.proposal==='none'||S.proposal==='rejected') S.proposal='pending'; go({kind:'cells',name:'lapse_rate',args:[0]}); const c=$('chatScroll'); if(c) c.scrollTop=c.scrollHeight; return; }
  if(k==='build'){ S.lower='build'; go({kind:'cells',name:'result_pv',args:[]}); return; }
  if(k==='welcome'){ S.welcome=true; S.runtime='browser'; render(); return; }
  if(k==='phase1'){ S.runtime='browser'; S.lower='data'; S.dataTab='all'; S.phase1=true; go({kind:'cells',name:'claims',args:[0]}); return; }
}
const parseArgs = s => (s===undefined||s===null) ? undefined : (s==='' ? [] : s.split(',').map(Number));
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return; const a=el.dataset.act, d=el.dataset;
  if(a==='ttoggle'){ e.stopPropagation(); S.expanded.has(d.path)?S.expanded.delete(d.path):S.expanded.add(d.path); render(); return; }
  switch(a){
    case 'go': goCells(d.name, parseArgs(d.args)); break;
    case 'goref': go({kind:'ref',name:d.name,args:[]}); if(S.lower!=='data'){ S.lower='data'; render(); } break;
    case 'gospace': go({kind:'space',name:'Projection',args:[]}); break;
    case 'scenario': scenario(d.s); break;
    case 'runtime': S.runtime=d.r; render(); break;
    case 'theme': S.theme=d.t; render(); break;
    case 'notes': S.notes=!S.notes; render(); break;
    case 'right': S.rightOpen=!S.rightOpen; render(); break;
    case 'bottom': S.bottomOpen=!S.bottomOpen; render(); break;
    case 'btab': S.bottom=d.t; S.bottomOpen=true; render(); break;
    case 'ltab': S.lower=d.t; render(); break;
    case 'maxlower': S.maxLower=!S.maxLower; render(); break;
    case 'dtab': S.dataTab=d.t; render(); break;
    case 'docs': S.docs=!S.docs; render(); break;
    case 'vals': S.vals=!S.vals; render(); break;
    case 'fmode': S.fmode=d.m; render(); break;
    case 'tdir': S.traceDir=d.d; S.expanded=new Set(['r']); S.traceSel=null; render(); break;
    case 'tview': S.traceView=d.v; render(); break;
    case 'tall': S.showAll.add(d.path); render(); break;
    case 'tpick': if(d.name!==undefined){ S.traceSel={path:d.path,name:d.name,args:parseArgs(d.args)||[]}; } render(); break;
    case 'trace': S.lower='trace'; S.traceDir=d.dir; S.expanded=new Set(['r']); S.traceSel=null; S.welcome=false; render(); break;
    case 'tstep': { const n=S.sel.args[0]+Number(d.d); if(n>=0) go({kind:'cells',name:S.sel.name,args:[n]}); break; }
    case 'sett': go({kind:'cells',name:S.sel.name,args:[Number(d.t)]}); break;
    case 'hist': { const p=S.hpos+Number(d.d); if(p>=0&&p<S.hist.length){ S.hpos=p; go(S.hist[p],false); } break; }
    case 'rail': if(d.r==='build'){ S.lower='build'; S.welcome=false; } else S.leftView=d.r; render(); break;
    case 'lapse': S.lapseOpen=!S.lapseOpen; render(); break;
    case 'tools': S.toolsOpen=!S.toolsOpen; render(); break;
    case 'revsel': S.revSel=Number(d.i); render(); break;
    case 'openreview': S.lower='review'; S.welcome=false; render(); break;
    case 'approve': S.proposal='applied'; S.lapseOpen=true; render(); toast('Applied: LapseUp added · journal #13 · Undo available'); break;
    case 'reject': S.proposal='rejected'; render(); toast('Proposal rejected · nothing was changed'); break;
    case 'undo': S.proposal='pending'; render(); toast('Undone: LapseUp removed'); break;
    case 'ask': S.rightOpen=true; render(); toast(S.phase1?'Not live yet — this is a recorded walkthrough':'Selection attached to the assistant (Ctrl+K)'); break;
    case 'notify': toast('Mockup only — this would capture an email for the launch list'); break;
    case 'openmodel': if(d.name===D.meta.model){ scenario('explore'); } else toast(d.name+': only '+D.meta.model+' is loaded in this mockup'); break;
  }
});
$('filter').addEventListener('input',e=>{ S.filter=e.target.value; renderLeft(); });
document.addEventListener('change',e=>{ if(e.target.id==='targ'){ const n=parseInt(e.target.value,10); if(!isNaN(n)&&n>=0) go({kind:'cells',name:S.sel.name,args:[n]}); } });
document.addEventListener('keydown',e=>{ if(e.altKey&&e.key==='ArrowLeft'){ const b=document.querySelector('[data-act="hist"][data-d="-1"]'); if(b) b.click(); } if(e.altKey&&e.key==='ArrowRight'){ const b=document.querySelector('[data-act="hist"][data-d="1"]'); if(b) b.click(); } });
scenario('explore');
</script>
